name: Supabase Database Backup (TBW Team App)

# Kostenlose Supabase-Projekte enthalten keine automatischen Backups (das
# gibt es erst ab einem bezahlten Tarif) — dieser Workflow zieht deshalb
# einmal täglich einen vollständigen Datenbank-Dump (Schema + Daten) und
# legt ihn als GitHub-Actions-Artefakt ab (30 Tage Aufbewahrung, danach
# automatisch gelöscht). Kein zusätzlicher Dienst/Account nötig.
#
# Setup: unter Settings -> Secrets and variables -> Actions ein Secret
#   TBW_SUPABASE_DB_URL
# anlegen, mit dem Verbindungsstring aus Supabase unter
# Project Settings -> Database -> Connection string -> "Session pooler"
# (NICHT "Direct connection" — die ist von GitHub-Actions-Runnern aus oft
# nicht erreichbar, da nur per IPv6; der Session-Pooler unterstützt IPv4).
#
# Wiederherstellung im Notfall: heruntergeladenes Artefakt entpacken, dann
#   psql "<Connection-String>" -f backup-YYYY-MM-DD.sql
# gegen ein leeres/neues Supabase-Projekt laufen lassen.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        # Supabase-Projekte laufen mittlerweile auf Postgres 17 — pg_dump
        # weigert sich, von einem neueren Server als sich selbst zu dumpen,
        # und Ubuntus Standard-Paketquelle liefert nur Client 16. Deshalb
        # über das offizielle PostgreSQL-APT-Repository den zur Server-
        # Version passenden Client installieren.
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-17

      - name: Dump database
        id: dump
        run: |
          if [ -z "${TBW_SUPABASE_DB_URL}" ]; then
            echo "TBW_SUPABASE_DB_URL secret is not set yet - skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Der GitHub-Actions-Runner bringt bereits einen älteren pg_dump
          # mit, der unter dem einfachen Befehl "pg_dump" Vorrang vor dem
          # gerade installierten Client 17 hat — deshalb hier den
          # versionierten Pfad direkt ansprechen statt nur "pg_dump".
          /usr/lib/postgresql/17/bin/pg_dump "${TBW_SUPABASE_DB_URL}" \
            --no-owner --no-privileges \
            -f "backup-$(date +%Y-%m-%d).sql"
        env:
          TBW_SUPABASE_DB_URL: ${{ secrets.TBW_SUPABASE_DB_URL }}

      - name: Upload backup artifact
        if: steps.dump.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup-*.sql
          retention-days: 30
