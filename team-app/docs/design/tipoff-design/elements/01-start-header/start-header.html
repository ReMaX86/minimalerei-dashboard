<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TipOff – Referenz: Start-Header (V2, Stand 2)</title>
<!--
  REFERENZ-UMSETZUNG „Start-Header V2" – 1:1-Vorlage für die App (Stand 2).
  Werte entsprechen tokens.css. Beim Umsetzen die Token-Variablen der App verwenden.

  Demo-Zustände über URL-Parameter:
    ?open=1      Menü offen
    ?num=0       ohne Rückennummer (Kopf zeigt stattdessen den Avatar)
    ?push=0      Push aus
    ?role=spieler | trainer | trainer-spieler
    ?teams=2     mehrere Teams → Team-Pille wird zum Button mit Pfeil
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400..700&display=swap">
<style>
:root{
  --to-bg:#0A0C0F; --to-surface:#12151A; --to-surface-2:#1A1E25; --to-line:#2A303A;
  --to-divider:#262B34; --to-text:#F2F4F7; --to-text-2:#A3ABB8; --to-text-3:#7C8594;
  --to-accent:#C8FF2E; --to-on-accent:#0A0C0F; --to-danger-text:#FF7A85;
  --to-display-xl:32px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--to-bg);color:var(--to-text);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
[hidden]{display:none !important}

.screen{position:relative;width:390px;min-height:460px;padding:56px 20px 0}

/* A) Kopfzeile */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* Team-Pille: 1 Team = reine Anzeige (div), >1 Team = Button mit Pfeil */
.team-pill{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 10px;
  border-radius:999px;border:1px solid var(--to-line);background:var(--to-surface)}
button.team-pill{padding-right:14px;cursor:pointer}
.team-pill__logo{width:24px;height:24px;flex:none}
.team-pill__name{font-size:14px;font-weight:600;line-height:1}
.team-pill__squad{font-size:14px;color:var(--to-text-2);line-height:1}
.team-pill__chev{width:14px;height:14px;flex:none;color:var(--to-text-2)}

/* Avatar: Initialen/Foto exakt zentriert */
.avatar{position:relative;width:48px;height:48px;flex:none;padding:0;border-radius:50%;
  border:2px solid var(--to-line);background:var(--to-surface-2);overflow:hidden;cursor:pointer;
  display:grid;place-items:center;
  font-size:15px;font-weight:600;line-height:1;letter-spacing:0;text-align:center}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar[aria-expanded="true"]{border-color:var(--to-accent)}

/* C) Begrüßung */
.greeting{display:flex;flex-direction:column;gap:10px;margin-top:32px}
.greeting h1{margin:0;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;font-style:italic;
  font-size:var(--to-display-xl);letter-spacing:-0.035em;line-height:1.05}
.greeting p{margin:0;font-size:16px;color:var(--to-text-2)}
.greeting p strong{color:var(--to-accent);font-weight:600}

/* B) Profil-Menü */
.menu{position:absolute;right:20px;top:114px;width:264px;border-radius:20px;background:var(--to-surface-2);
  border:1px solid var(--to-line);box-shadow:0 24px 48px rgba(0,0,0,.55);overflow:hidden;z-index:10}
.menu__head{display:flex;align-items:center;gap:12px;padding:16px}
.menu__num{min-width:36px;font-family:'Archivo',sans-serif;font-stretch:62%;font-weight:800;font-size:36px;line-height:1;color:var(--to-accent)}
.menu__avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--to-bg);border:1px solid var(--to-line);
  display:grid;place-items:center;font-size:14px;font-weight:600;line-height:1;overflow:hidden;position:relative}
.menu__avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.menu__who{display:flex;flex-direction:column;gap:3px;min-width:0}
.menu__name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu__role{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--to-text-3)}

.menu__item{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border:0;
  border-top:1px solid var(--to-divider);background:transparent;font-size:15px;text-align:left;cursor:pointer}
.menu__item svg.icon{width:19px;height:19px;flex:none;color:var(--to-text-2)}
.menu__label{flex:1;display:flex;flex-direction:column;gap:2px}
.menu__hint{font-size:12px;color:var(--to-text-3)}
.menu__item--danger{color:var(--to-danger-text);font-weight:500}
.menu__item--danger svg.icon{color:currentColor}

/* Schalter (Push an/aus) */
.switch{width:44px;height:26px;flex:none;border-radius:13px;padding:3px;background:var(--to-line);display:flex;justify-content:flex-start;transition:background .15s}
.switch::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--to-text-3);transition:transform .15s}
[aria-checked="true"] .switch{background:var(--to-accent)}
[aria-checked="true"] .switch::after{background:var(--to-on-accent);transform:translateX(18px)}

.peek{margin-top:32px;height:120px;border-radius:26px 26px 0 0;background:var(--to-surface);border:1px solid #232830;border-bottom:0;opacity:.55}
</style>
</head>
<body>
<div class="screen">

  <header class="topbar">
    <!-- 1 Team: <div class="team-pill">, mehrere Teams: <button class="team-pill"> + Pfeil, öffnet Team-Auswahl -->
    <div class="team-pill" id="team-pill">
      <svg class="team-pill__logo" viewBox="0 0 100 100" aria-hidden="true"><path d="M64.91 34.7A26 26 0 1 1 35.09 34.7" fill="none" stroke="#C8FF2E" stroke-width="11" stroke-linecap="round"/><circle cx="50" cy="19" r="10" fill="#C8FF2E"/></svg>
      <span class="team-pill__name">TB Wülfrath</span>
      <span class="team-pill__squad">Herren</span>
    </div>

    <button type="button" class="avatar" id="avatar" aria-label="Profil-Menü" aria-haspopup="menu" aria-expanded="false" aria-controls="profile-menu">
      <span>MR</span>
    </button>
  </header>

  <div class="greeting">
    <h1>Hi Marc!</h1>
    <p>Noch <strong>3 Tage</strong> bis zum Sprungball.</p>
  </div>

  <div class="peek" aria-hidden="true"></div>

  <div class="menu" id="profile-menu" role="menu" aria-label="Profil" hidden>
    <div class="menu__head">
      <span class="menu__num" id="head-num">26</span>
      <span class="menu__avatar" id="head-avatar" hidden>MR</span>
      <span class="menu__who"><span class="menu__name">Marc Rewald</span><span class="menu__role" id="head-role">Trainer · Spieler</span></span>
    </div>

    <button type="button" class="menu__item" role="menuitem">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <span class="menu__label">Mein Profil<span class="menu__hint">Foto, Größe, Geburtsdatum</span></span>
    </button>

    <button type="button" class="menu__item" role="menuitemcheckbox" aria-checked="true" id="push">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="menu__label">Benachrichtigungen<span class="menu__hint" id="push-hint">Push ist an</span></span>
      <span class="switch" aria-hidden="true"></span>
    </button>

    <button type="button" class="menu__item menu__item--danger" role="menuitem">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Abmelden
    </button>
  </div>

</div>
<script>
  const q = new URLSearchParams(location.search);
  const avatar = document.getElementById('avatar');
  const menu = document.getElementById('profile-menu');
  const push = document.getElementById('push');
  function setOpen(open){ menu.hidden = !open; avatar.setAttribute('aria-expanded', String(open)); }
  function setPush(on){ push.setAttribute('aria-checked', String(on)); document.getElementById('push-hint').textContent = on ? 'Push ist an' : 'Push ist aus'; }
  avatar.addEventListener('click', e => { e.stopPropagation(); setOpen(menu.hidden); });
  push.addEventListener('click', e => { e.stopPropagation(); setPush(push.getAttribute('aria-checked') !== 'true'); });
  document.addEventListener('click', e => { if (!menu.contains(e.target)) setOpen(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });

  // Demo-Zustände
  if (q.get('num') === '0') { document.getElementById('head-num').hidden = true; document.getElementById('head-avatar').hidden = false; }
  if (q.get('push') === '0') setPush(false);
  const roles = { 'spieler': 'Spieler', 'trainer': 'Trainer', 'trainer-spieler': 'Trainer · Spieler' };
  if (roles[q.get('role')]) document.getElementById('head-role').textContent = roles[q.get('role')];
  if (q.get('teams') === '2') {
    const old = document.getElementById('team-pill');
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'team-pill'; btn.setAttribute('aria-label', 'Team wechseln');
    btn.innerHTML = old.innerHTML + '<svg class="team-pill__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
    old.replaceWith(btn);
  }
  if (q.get('open') === '1') setOpen(true);
</script>
</body>
</html>
