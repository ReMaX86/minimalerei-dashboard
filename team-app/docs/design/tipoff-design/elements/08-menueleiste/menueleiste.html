<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TipOff · Menüleiste</title>
<!--
  REFERENZ-UMSETZUNG der schwebenden Menüleiste (Tab Bar).
  Aktives Ziel als volt Kapsel mit Text, alle anderen nur als Symbol.
  Werte entsprechen tokens.css – in der App die Token-Variablen verwenden, nicht diese Datei einbinden.

  Zustände über die URL:
    ?state=start    Start aktiv, Trainer/Admin (sechs Ziele) – Standard
    ?state=duty     Kampfgericht aktiv (längstes Wort)
    ?state=admin    Admin aktiv
    ?state=badges   mit Hinweispunkten an Spiele und Kampfgericht
    ?state=player   Spieler – fünf Ziele ohne Admin
    ?state=games    Spieler, Spiele aktiv
  Klickbar: jedes Ziel wechselt die Kapsel.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400..700&display=swap">
<style>
:root{
  --to-bg:#0A0C0F; --to-surface:#12151A; --to-surface-2:#1A1E25;
  --to-border:#232830; --to-line:#2A303A;
  --to-text:#F2F4F7; --to-text-2:#A3ABB8; --to-text-3:#7C8594; --to-text-4:#5B626D;
  --to-accent:#C8FF2E; --to-on-accent:#0A0C0F;
  --to-nav-h:60px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--to-bg);color:var(--to-text);
  font-family:'Geist',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

/* Seiteninhalt – nur Kulisse für diese Vorlage */
.page{width:390px;margin:0 auto;padding:20px 20px calc(var(--to-nav-h) + 34px);
  display:flex;flex-direction:column;gap:12px}
.demo{border-radius:20px;background:var(--to-surface);border:1px solid var(--to-border);
  padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.demo__label{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--to-text-3)}
.demo__text{font-size:14px;color:var(--to-text-2)}

/* ---------- Menüleiste ---------- */
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
  z-index:50;display:flex;align-items:center;gap:2px;padding:7px;
  border-radius:26px;border:1px solid var(--to-border);
  background:rgba(18,21,26,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 14px 34px rgba(0,0,0,.55)}
@media (min-width:430px){ .nav{left:calc(50% - 185px);right:auto;width:370px} }

.tab{display:flex;align-items:center;justify-content:center;gap:0;
  width:38px;height:44px;flex:none;border:0;border-radius:999px;background:transparent;
  color:var(--to-text-3);text-decoration:none;position:relative;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:width .18s ease,background-color .18s ease,color .18s ease,padding .18s ease}
.tab svg{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tab__label{max-width:0;overflow:hidden;white-space:nowrap;opacity:0;
  font-size:13px;font-weight:600;letter-spacing:-.01em;
  transition:max-width .18s ease,opacity .14s ease,margin .18s ease}

.tab[aria-current="page"]{width:auto;padding:0 14px;gap:8px;
  background:var(--to-accent);color:var(--to-on-accent)}
.tab[aria-current="page"] svg{stroke-width:2}
.tab[aria-current="page"] .tab__label{max-width:140px;opacity:1}

.tab__dot{position:absolute;top:8px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--to-accent);border:2px solid #12151A}
.tab[aria-current="page"] .tab__dot{display:none}

.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>

<div class="page">
  <div class="demo">
    <span class="demo__label">SEITENINHALT</span>
    <span class="demo__text">Die Leiste schwebt über dem Inhalt. Der Inhalt bekommt unten so viel Abstand, dass nichts darunter verschwindet.</span>
  </div>
  <div class="demo">
    <span class="demo__label">HINWEIS</span>
    <span class="demo__text">Volt-Punkt am Symbol heißt: dort liegt etwas an.</span>
  </div>
</div>

<nav class="nav" id="nav" aria-label="Hauptmenü"></nav>

<script>
var TABS = {
  start: { label: 'Start', icon: '<path d="M4 11.5 12 4l8 7.5"></path><path d="M6.5 10.5V20h11v-9.5"></path>' },
  games: { label: 'Spiele', icon: '<rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M12 5v14"></path><circle cx="12" cy="12" r="2.4"></circle>' },
  team:  { label: 'Team',   icon: '<path d="M9 11.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"></path><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5a3.5 3.5 0 0 1 0 7M18 14.5c1.9.6 3 2.6 3 5.5"></path>' },
  kits:  { label: 'Trikots', icon: '<path d="M8.5 4 12 6l3.5-2L20 7l-2.5 3v10h-11V10L4 7z"></path>' },
  duty:  { label: 'Kampfgericht', icon: '<circle cx="12" cy="13.5" r="7.5"></circle><path d="M12 13.5V9.5"></path><path d="M9.5 2.5h5"></path>' },
  admin: { label: 'Admin', icon: '<circle cx="12" cy="12" r="3.5"></circle><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4 5.3 5.3"></path>' }
};
var ALL = ['start', 'games', 'team', 'kits', 'duty', 'admin'];
var PLAYER = ['start', 'games', 'team', 'kits', 'duty'];

var BASE = { keys: ALL, active: 'start', badges: [] };
var STATES = {
  start:  {},
  duty:   { active: 'duty' },
  admin:  { active: 'admin' },
  badges: { badges: ['games', 'duty'] },
  player: { keys: PLAYER, active: 'start' },
  games:  { keys: PLAYER, active: 'games' }
};

var key = new URLSearchParams(location.search).get('state') || 'start';
var data = Object.assign({}, BASE, STATES[key] || {});
var active = data.active;

var nav = document.getElementById('nav');

function render() {
  nav.innerHTML = data.keys.map(function (k) {
    var t = TABS[k];
    var on = k === active;
    var dot = (!on && data.badges.indexOf(k) > -1)
      ? '<span class="tab__dot"></span><span class="sr">Es liegt etwas an</span>' : '';
    return '<a class="tab" href="#" data-key="' + k + '"' +
           (on ? ' aria-current="page"' : '') +
           ' aria-label="' + t.label + '">' +
           '<svg viewBox="0 0 24 24" aria-hidden="true">' + t.icon + '</svg>' +
           '<span class="tab__label">' + t.label + '</span>' + dot + '</a>';
  }).join('');
}
render();

nav.addEventListener('click', function (e) {
  var a = e.target.closest('.tab');
  if (!a) return;
  e.preventDefault();
  active = a.getAttribute('data-key');
  render();
});
</script>
</body>
</html>
