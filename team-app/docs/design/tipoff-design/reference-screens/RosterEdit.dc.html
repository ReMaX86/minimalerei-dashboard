<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TipOff – Kader bearbeiten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..700&amp;display=swap">
<style>body{margin:0;background:#0A0C0F}a{color:#C8FF2E}a:hover{color:#DBFF73}</style>
</helmet>
<div style="width: 390px; height: 1560px; box-sizing: border-box; background: #0A0C0F; color: #F2F4F7; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column;">

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 52px 20px 24px;">

<header style="display: grid; grid-template-columns: 90px minmax(0, 1fr) 90px; align-items: center;">
<a href="Roster.dc.html" style="display: flex; align-items: center; height: 44px; color: #A3ABB8; text-decoration: none; font-size: 15px;">Abbrechen</a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.14em; color: #C8FF2E;">TRAINER-MODUS</span>
<span style="font-size: 16px; font-weight: 600;">Kader bearbeiten</span>
</div>
<a href="Roster.dc.html" style="display: flex; align-items: center; justify-content: flex-end; height: 44px; text-decoration: none; font-size: 15px; font-weight: 600;">Fertig</a>
</header>

<button type="button" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #12151A; border: 1px solid #232830; color: #F2F4F7; font-family: 'Geist', sans-serif; text-align: left; width: 100%;">
<span style="display: flex; flex-direction: column; gap: 3px;">
<span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #7C8594;">SPIEL · HEIM</span>
<span style="font-size: 15px; font-weight: 600;">Sa 26.09. · vs. Hawks Mettmann</span>
</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #A3ABB8;">Wechseln<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
</button>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 22px; background: #12151A; border: 1px solid {{frame}};">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
<div style="display: flex; align-items: baseline; gap: 4px;">
<span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-style: italic; font-size: 48px; letter-spacing: -0.04em; line-height: 0.9; color: {{countColor}};">{{ count }}</span>
<span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-style: italic; font-size: 26px; letter-spacing: -0.03em; color: #5A626F;">/12</span>
</div>
<span style="font-size: 13px; color: {{msgColor}}; text-align: right; line-height: 1.35; max-width: 190px;">{{ msg }}</span>
</div>
<div style="display: flex; gap: 3px;">
<sc-for list="{{ segs }}" as="s" hint-placeholder-count="12">
<div style="flex-grow: 1; height: 6px; border-radius: 3px; background: {{s.c}};"></div>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 8px;">
<button type="button" onClick="{{ resetLast }}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A303A; background: transparent; color: #F2F4F7; font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 500;">Wie letztes Spiel</button>
<button type="button" onClick="{{ clearAll }}" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A303A; background: transparent; color: #F2F4F7; font-family: 'Geist', sans-serif; font-size: 13px; font-weight: 500;">Alle abwählen</button>
</div>

<div style="display: flex; flex-direction: column; border-radius: 22px; background: #12151A; border: 1px solid #232830; overflow: hidden;">
<sc-for list="{{ rows }}" as="p" hint-placeholder-count="14">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 14px 0 10px; border-top: 1px solid {{p.divider}};">
<svg viewBox="0 0 24 24" width="18" height="18" fill="#4A515C" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg>
<span style="width: 36px; flex-shrink: 0; font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 800; font-size: 30px; line-height: 1; color: {{p.numColor}};">{{p.num}}</span>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="font-size: 15px; font-weight: 600; color: {{p.nameColor}};">{{p.name}}</span>
<span style="font-size: 12px; color: {{p.subColor}};">{{p.sub}}</span>
</div>
<button type="button" aria-pressed="{{ p.on }}" aria-label="{{ p.label }}" onClick="{{ p.toggle }}" style="width: 52px; height: 44px; flex-shrink: 0; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: flex-end;">
<span style="width: 50px; height: 30px; box-sizing: border-box; border-radius: 15px; padding: 3px; background: {{p.track}}; display: flex; justify-content: {{p.justify}};">
<span style="width: 24px; height: 24px; border-radius: 50%; background: {{p.knob}};"></span>
</span>
</button>
</div>
</sc-for>
</div>

<button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 16px; border-radius: 18px; border: 1px dashed #3A414C; background: transparent; color: #F2F4F7; font-family: 'Geist', sans-serif; text-align: left; width: 100%;">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: #1A1E25; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#C8FF2E" style="stroke-width: 2; stroke-linecap: round;" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 15px; font-weight: 600;">Spieler hinzufügen</span>
<span style="font-size: 12px; color: #A3ABB8;">Persönlichen Zugangscode erzeugen</span>
</span>
</button>

</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 34px; border-top: 1px solid #1F242C; background: #0A0C0F;">
<sc-if value="{{ valid }}" hint-placeholder-val="{{ true }}">
<a href="Roster.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 22px; border-radius: 16px; background: #C8FF2E; color: #0A0C0F; text-decoration: none; font-size: 16px; font-weight: 600;">
<span>Kader veröffentlichen</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 14px;">{{ count }}/12</span>
</a>
</sc-if>
<sc-if value="{{ invalid }}" hint-placeholder-val="{{ false }}">
<button type="button" disabled="{{ true }}" style="display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 22px; border: 0; border-radius: 16px; background: #1A1E25; color: #7C8594; font-family: 'Geist', sans-serif; font-size: 16px; font-weight: 600; width: 100%;">
<span>Kader veröffentlichen</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 14px;">{{ count }}/12</span>
</button>
</sc-if>
<p style="margin: 0; text-align: center; font-size: 12px; color: #7C8594;">Alle 14 Spieler bekommen eine Benachrichtigung.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
renderVals() {
const LAST = [4, 5, 6, 7, 8, 9, 10, 11, 12, 14];
const sel = (this.state && this.state.sel) ? this.state.sel : LAST;
const pad = function (n) { return n < 10 ? '0' + n : String(n); };
const players = [
{ n: 4, name: 'Luca Brandt', sub: 'PG · Kapitän' },
{ n: 5, name: 'Elias Yilmaz', sub: 'SG' },
{ n: 6, name: 'Noah Petrović', sub: 'SF' },
{ n: 7, name: 'Jonas Keller', sub: 'SG' },
{ n: 8, name: 'Ben Hoffmann', sub: 'PF' },
{ n: 9, name: 'Finn Schröder', sub: 'PG' },
{ n: 10, name: 'Mats Okafor', sub: 'C' },
{ n: 11, name: 'Leon Vogt', sub: 'SF' },
{ n: 12, name: 'Paul Weber', sub: 'PF' },
{ n: 13, name: 'Emil Nowak', sub: 'SG · hat zugesagt' },
{ n: 14, name: 'Jannik Berger', sub: 'C' },
{ n: 15, name: 'Tim Kaya', sub: 'Abgemeldet · Klassenfahrt', away: true },
{ n: 22, name: 'Oskar Lange', sub: 'SF · hat zugesagt' },
{ n: 23, name: 'David Schulz', sub: 'Abgemeldet', away: true }
];
const count = sel.length;
const over = count > 12;
const rows = players.map((p, i) => {
const on = sel.indexOf(p.n) !== -1;
return {
num: pad(p.n), name: p.name, sub: p.sub, on: on,
label: p.name + (on ? ' aus dem Kader nehmen' : ' nominieren'),
divider: i === 0 ? 'transparent' : '#1F242C',
numColor: on ? '#C8FF2E' : '#4A515C',
nameColor: on ? '#F2F4F7' : '#A3ABB8',
subColor: p.away ? '#FF7A85' : '#7C8594',
track: on ? (over ? '#FF5A67' : '#C8FF2E') : '#2A303A',
knob: on ? '#0A0C0F' : '#7C8594',
justify: on ? 'flex-end' : 'flex-start',
toggle: () => {
const cur = (this.state && this.state.sel) ? this.state.sel : LAST;
const next = cur.indexOf(p.n) !== -1 ? cur.filter(function (x) { return x !== p.n; }) : cur.concat([p.n]);
this.setState({ sel: next });
}
};
});
const segs = [];
for (let i = 0; i < 12; i++) segs.push({ c: over ? '#FF5A67' : (i < count ? '#C8FF2E' : '#2A303A') });
let msg;
if (over) msg = (count - 12) + ' zu viel – max. 12 auf dem Spielberichtsbogen';
else if (count === 12) msg = 'Kader voll';
else if (count < 5) msg = 'Mindestens 5 Spieler nötig';
else msg = 'Noch ' + (12 - count) + (12 - count === 1 ? ' Platz' : ' Plätze') + ' frei';
const valid = !over && count >= 5;
return {
rows: rows,
segs: segs,
count: count,
msg: msg,
valid: valid,
invalid: !valid,
frame: over ? '#FF5A67' : '#232830',
countColor: over ? '#FF5A67' : '#C8FF2E',
msgColor: over ? '#FF7A85' : '#A3ABB8',
resetLast: () => this.setState({ sel: LAST }),
clearAll: () => this.setState({ sel: [] })
};
}
}
</script>
</body>
</html>
